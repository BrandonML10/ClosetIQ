version: '3.8'

services:
  frontend:
    build: 
      context: ./clogo-app
    ports:
      - "3000:3000"
    environment:
      # Pasa las variables de entorno de tu máquina al contenedor
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - ml-api

  ml-api:
    build:
      context: ./clogo-ml
    ports:
      - "8000:8000"